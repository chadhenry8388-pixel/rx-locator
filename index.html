<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{
 --bg:#f2f5f7; --card:#fff; --ink:#14201f; --dim:#5d6b73; --line:#dde3e8;
 --brand:#0f766e; --on-brand:#fff; --soft:#d6f2ee; --warn:#b45309; --warnbg:#fef3c7;
 --hit:#f59e0b; --sh:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
 --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#0d1413; --card:#18211f; --ink:#e9f1ef; --dim:#94a4a7; --line:#27342f;
 --brand:#5eead4; --on-brand:#06231f; --soft:#0c3b36; --warn:#fbbf24; --warnbg:#3a2c0a;
 --sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);}}
:root[data-theme=dark]{
 --bg:#0d1413; --card:#18211f; --ink:#e9f1ef; --dim:#94a4a7; --line:#27342f;
 --brand:#5eead4; --on-brand:#06231f; --soft:#0c3b36; --warn:#fbbf24; --warnbg:#3a2c0a;
 --sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior-y:none;
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Malgun Gothic",sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:0 12px calc(40px + var(--safe-b))}

/* ═══ 헤더 : 폰에서 항상 붙어있는 검색창 ═══ */
header{position:sticky;top:0;z-index:30;margin:0 -12px;padding:8px 12px 10px;
 background:color-mix(in srgb,var(--bg) 88%,transparent);
 -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
 border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
h1{font-size:14px;margin:0;font-weight:700;flex:1;letter-spacing:-.3px;cursor:default;
 -webkit-user-select:none;user-select:none}
body.editing h1{color:var(--warn)}
h1 small{font-weight:500;color:var(--dim);font-size:11px;margin-left:5px}
.ico{background:var(--card);border:1px solid var(--line);color:var(--dim);flex:0 0 auto;
 width:40px;height:40px;border-radius:12px;font-size:16px;cursor:pointer;display:grid;place-items:center}
.ico[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.sbox{position:relative}
#q{width:100%;height:54px;padding:0 48px 0 46px;font-size:17px;font-weight:600;
 border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--sh)}
#q::placeholder{font-weight:500;color:var(--dim)}
#q:focus{outline:none;border-color:var(--brand)}
.mag{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.45;pointer-events:none}
#clr{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:var(--line);
 color:var(--dim);width:32px;height:32px;border-radius:50%;cursor:pointer;display:none;font-size:15px}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;
 -webkit-overflow-scrolling:touch;padding-bottom:1px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--dim);
 padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
.chips .lbl{flex:0 0 auto;font-size:11px;color:var(--dim);align-self:center;padding-right:2px}

/* ═══ 결과 ═══ */
.count{font-size:12px;color:var(--dim);margin:16px 4px 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 13px;min-height:58px;
 border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--soft)}
.nm{flex:1;min-width:0;font-weight:600;font-size:16px;line-height:1.35;word-break:break-all}
.nm .hl{background:var(--hit);color:#3b2708;border-radius:3px;padding:0 1px}
.vb{display:inline-block;background:var(--soft);color:var(--brand);font-size:10px;font-weight:800;
 padding:1px 5px;border-radius:4px;margin-right:4px;vertical-align:2px}
.loc{flex:0 0 auto;text-align:center;background:var(--soft);border-radius:10px;padding:7px 10px;min-width:74px}
.loc b{display:block;font-size:16px;color:var(--brand);font-weight:800;letter-spacing:-.4px;line-height:1.15}
.loc span{font-size:10px;color:var(--dim);font-weight:600}
.alert{display:flex;gap:7px;background:var(--warnbg);color:var(--warn);
 padding:9px 13px;font-size:12.5px;border-top:1px solid var(--line);line-height:1.45}
.empty{text-align:center;padding:46px 20px;color:var(--dim)}
.empty .big{font-size:38px;margin-bottom:8px}

/* ═══ 평면도 : 폰 폭에 맞춰 축소 ═══ */
h2{font-size:12px;color:var(--dim);margin:24px 4px 9px;font-weight:800;letter-spacing:.3px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;
 box-shadow:var(--sh);display:grid;gap:4px;grid-template-columns:repeat(7,1fr);
 grid-auto-rows:minmax(44px,auto)}
.cell{border-radius:8px;display:grid;place-items:center;text-align:center;padding:2px 1px;
 font-size:10.5px;font-weight:700;line-height:1.15;overflow:hidden;word-break:break-all}
.cell.b{background:var(--soft);color:var(--brand);cursor:pointer;border:1.5px solid transparent}
.cell.b:active{border-color:var(--brand)}
.cell.b.on{background:var(--hit);color:#3b2708;border-color:var(--hit);
 box-shadow:0 0 0 3px rgba(245,158,11,.28);animation:pp .45s}
.cell .c{font-weight:600;font-size:9px;opacity:.7;display:block}
@keyframes pp{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.cell.mid{color:var(--dim);font-weight:700;font-size:11px;letter-spacing:2px;opacity:.55}
.cell.n{font-size:9.5px;color:var(--dim);font-weight:600;opacity:.65;background:var(--bg)}
.legend{font-size:11px;color:var(--dim);margin:8px 4px 0;text-align:center}
@media (min-width:520px){
 .plan{gap:6px;grid-auto-rows:minmax(54px,auto);padding:12px}
 .cell{font-size:12.5px}.cell .c{font-size:10px}.cell.mid{font-size:13px}
}

/* ═══ 바텀시트 ═══ */
dialog{border:0;padding:0;background:var(--card);color:var(--ink);width:100%;max-width:620px;
 max-height:86vh;height:auto;border-radius:18px 18px 0 0;margin:auto auto 0;
 box-shadow:0 -6px 34px rgba(0,0,0,.3);overscroll-behavior:contain}
dialog::backdrop{background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(2px)}
.grab{width:38px;height:4px;background:var(--line);border-radius:99px;margin:9px auto 0}
.dh{position:sticky;top:0;z-index:2;background:var(--card);padding:10px 14px 11px;
 border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dh h3{margin:0;font-size:17px;font-weight:800}
.dh .sub{font-size:11.5px;color:var(--dim);font-weight:600;margin-top:1px}
.db{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + var(--safe-b));
 max-height:calc(86vh - 74px)}
.sh{font-size:12px;font-weight:800;color:var(--brand);background:var(--soft);
 padding:7px 14px;position:sticky;top:0;z-index:1}
.di{padding:11px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;min-height:46px}
.di span{flex:1;word-break:break-all;font-size:15px}
.di.hit{background:var(--warnbg)}
.memo{font-weight:500;opacity:.75}

/* ═══ 편집 ═══ */
.edit-only{display:none}
body.editing .edit-only{display:flex}
body.editing .ebar{display:block}
.ebar{display:none;background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);
 border-radius:13px;padding:12px 13px;margin-top:12px;font-size:12.5px;line-height:1.55}
.ebtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:42px;
 padding:0 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.mini{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--dim);
 min-width:44px;height:36px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer}
.mini.del{color:#e11d48;border-color:#e11d48}
input.ed{border:1px solid var(--line);background:var(--bg);color:var(--ink);height:40px;
 padding:0 11px;border-radius:9px;font-size:16px;width:100%;flex:1}
.addrow{padding:10px 14px;border-top:2px dashed var(--line);gap:7px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(26px + var(--safe-b));transform:translateX(-50%);
 background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:99px;font-size:14px;
 font-weight:700;z-index:99;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
footer{text-align:center;font-size:10.5px;color:var(--dim);margin-top:26px;line-height:1.8}
</style></head><body>

<div id="out"></div>

</div>

</dialog>

const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', KEY='wonpharm.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let DB=null;
function load(){try{const s=localStorage.getItem(KEY);DB=s?JSON.parse(s):structuredClone(RAW);}
 catch(e){DB=structuredClone(RAW);}index();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('저장 공간 부족');}
 index();render();plan();}

const cho=s=>[...s].map(c=>{const k=c.charCodeAt(0)-0xAC00;
 return k>=0&&k<11172?CHO[Math.floor(k/588)]:c}).join('');
const norm=s=>s.toLowerCase().replace(/[\s·,]/g,'');
let IDX=[],CONF={};
function index(){
 IDX=DB.drugs.map((d,i)=>({...d,i,_n:norm(d.n),_c:cho(d.n).replace(/\s/g,'')}));
 const g={};IDX.forEach(d=>{const b=d.n.replace(/[\d./,\s()].*$/,'');if(b.length>=2)(g[b]=g[b]||[]).push(d);});
 CONF={};Object.values(g).forEach(a=>{if(new Set(a.map(x=>x.n)).size>1)
  a.forEach(x=>CONF[x.i]=a.filter(y=>y.n!==x.n));});
}
function search(q){const n=norm(q);if(!n)return[];
 const isCho=/^[ㄱ-ㅎ]+$/.test(n);
 return IDX.filter(d=>isCho?d._c.includes(n):(d._n.includes(n)||d._c.includes(n)))
  .sort((a,b)=>{const f=x=>x._n.startsWith(n)?0:x._c.startsWith(n)?1:2;
   return f(a)-f(b)||a.n.length-b.n.length||a.n.localeCompare(b.n,'ko');});}
function mark(name,q){const n=norm(q);if(!n||/^[ㄱ-ㅎ]+$/.test(n))return esc(name);
 const i=norm(name).indexOf(n);if(i<0)return esc(name);
 let a=0,seen=0;for(;a<name.length;a++){if(!/[\s·,]/.test(name[a])){if(seen===i)break;seen++;}}
 let b=a,c=0;for(;b<name.length&&c<n.length;b++)if(!/[\s·,]/.test(name[b]))c++;
 return esc(name.slice(0,a))+'<span class="hl">'+esc(name.slice(a,b))+'</span>'+esc(name.slice(b));}

let HI=new Set();
function render(){
 const q=$('#q').value.trim();$('#clr').style.display=q?'block':'none';
 const out=$('#out');HI=new Set();
 if(!q){out.innerHTML='';$('#planTitle').textContent='🗺 조제실 평면도';plan();return;}
 const r=search(q);
 if(!r.length){out.innerHTML=`<div class="empty"><div class="big">🔍</div>
  <b>"${esc(q)}" 없음</b><div style="margin-top:7px;font-size:13px">이름 일부만 입력해 보세요</div></div>`;
  $('#planTitle').textContent='🗺 조제실 평면도';plan();return;}
 r.forEach(d=>HI.add(d.c));
 let h=`<div class="count">${r.length}개 찾음</div><div class="card">`;
 r.slice(0,50).forEach(d=>{
  h+=`<div class="row" data-cab="${esc(d.c)}" data-shelf="${esc(d.s)}" data-i="${d.i}">
   <div class="nm">${d.v?'<span class="vb">V</span>':''}${mark(d.n,q)}</div>
   <div class="loc"><b>${esc(d.s)}</b><span>${esc(d.c)} 약장</span></div></div>`;
  const c=CONF[d.i];
  if(c)h+=`<div class="alert"><span>⚠️</span><div><b>헷갈림 주의</b> —
   ${c.slice(0,3).map(x=>esc(x.n)+' <b>('+esc(x.s)+')</b>').join(', ')}
   ${c.length>3?' 외 '+(c.length-3)+'개':''}</div></div>`;});
 h+='</div>';
 if(r.length>50)h+=`<div class="count">상위 50개만 표시 — 더 입력해 주세요</div>`;
 out.innerHTML=h;
 $('#planTitle').textContent='🗺 평면도 — '+[...HI].join(', ')+'';
 out.querySelectorAll('.row').forEach(el=>el.onclick=()=>open_(el.dataset.cab,el.dataset.shelf,+el.dataset.i));
 plan();
}

function plan(){
 const has={};DB.drugs.forEach(d=>has[d.c]=(has[d.c]||0)+1);
 let h='';
 LAYOUT.forEach(r=>r.forEach(c=>{
  if(c===null){h+='<div></div>';return;}
  const o=typeof c==='string'?{n:c}:c, sp=o.span?`grid-column:span ${o.span};`:'';
  if(o.t){h+=`<div class="cell ${o.t}" style="${sp}">${esc(o.n)}</div>`;return;}
  const k=has[o.n]||0;
  h+=`<div class="cell b${HI.has(o.n)?' on':''}" style="${sp}" data-cab="${esc(o.n)}">
   <div>${esc(o.n)}${k?`<span class="c">${k}</span>`:''}</div></div>`;}));
 $('#plan').innerHTML=h;
 $('#plan').querySelectorAll('[data-cab]').forEach(el=>el.onclick=()=>open_(el.dataset.cab));
}

let CUR=null;
function open_(cab,shelf,hi){
 CUR=cab;
 const list=DB.drugs.map((d,i)=>({...d,i})).filter(d=>d.c===cab);
 const by={};list.forEach(d=>(by[d.s]=by[d.s]||[]).push(d));
 $('#dt').textContent=cab+' 약장';
 $('#ds').textContent=`${Object.keys(by).length}개 칸 · 약 ${list.length}개`;
 let h='';
 Object.keys(by).forEach(s=>{
  const memo=(DB.notes||{})[s];
  h+=`<div class="sh" data-sh="${esc(s)}">${esc(s)}${memo?' · <span class="memo">'+esc(memo.join(', '))+'</span>':''}</div>`;
  by[s].forEach(d=>{h+=`<div class="di${d.i===hi?' hit':''}">${d.v?'<span class="vb">V</span>':''}
   <span>${esc(d.n)}</span>
   <button class="mini edit-only" data-act="ren" data-i="${d.i}">수정</button>
   <button class="mini del edit-only" data-act="del" data-i="${d.i}">삭제</button></div>`;});
  h+=`<div class="addrow edit-only"><input class="ed" placeholder="＋ ${esc(s)} 칸에 약 추가" data-add="${esc(s)}">
   <button class="mini" data-act="add" data-s="${esc(s)}">추가</button></div>`;});
 $('#dbody').innerHTML=h;
 $('#dbody').querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.stopPropagation();act(b);});
 $('#dlg').showModal();
 $('#dbody').scrollTop=0;
 if(shelf){const t=$(`#dbody [data-sh="${CSS.escape(shelf)}"]`);
  if(t)setTimeout(()=>$('#dbody').scrollTo({top:t.offsetTop-4,behavior:'instant'}),30);}
}
function act(b){const a=b.dataset.act;
 if(a==='del'){const d=DB.drugs[+b.dataset.i];
  if(confirm(`"${d.n}" 삭제할까요?`)){DB.drugs.splice(+b.dataset.i,1);save();open_(CUR);toast('삭제됨');}}
 if(a==='ren'){const d=DB.drugs[+b.dataset.i],v=prompt('약 이름',d.n);
  if(v&&v.trim()){d.n=v.trim();save();open_(CUR);toast('수정됨');}}
 if(a==='add'){const inp=$(`[data-add="${CSS.escape(b.dataset.s)}"]`),v=inp.value.trim();
  if(!v)return;DB.drugs.push({n:v,v:0,c:CUR,s:b.dataset.s});save();open_(CUR);toast('추가됨');}}

function recent(add){
 let r=[];try{r=JSON.parse(localStorage.getItem(KEY+'.r')||'[]');}catch(e){}
 if(add){r=[add,...r.filter(x=>x!==add)].slice(0,8);
  try{localStorage.setItem(KEY+'.r',JSON.stringify(r));}catch(e){}}
 $('#recent').innerHTML=r.length?'<span class="lbl">최근</span>'+
  r.map(x=>`<button class="chip">${esc(x)}</button>`).join(''):'';
 $('#recent').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  $('#q').value=b.textContent;render();$('#q').blur();});}

let rt;
$('#q').oninput=()=>{render();clearTimeout(rt);
 rt=setTimeout(()=>{const v=$('#q').value.trim();if(v.length>=2&&search(v).length)recent(v);},1400);};
$('#q').onkeydown=e=>{if(e.key==='Enter')$('#q').blur();};
$('#clr').onclick=()=>{$('#q').value='';render();$('#q').focus();};
$('#dx').onclick=()=>$('#dlg').close();
function setEdit(on){document.body.classList.toggle('editing',on);
 if(CUR&&$('#dlg').open)open_(CUR);}
let taps=0,tapT;
$('#ttl').onclick=()=>{
 if(document.body.classList.contains('editing'))return;
 taps++;clearTimeout(tapT);
 if(taps>=5){taps=0;setEdit(true);toast('✏️ 편집 모드가 켜졌습니다');
  window.scrollTo({top:0,behavior:'smooth'});return;}
 if(taps>=3)toast((5-taps)+'번 더 누르면 편집 모드');
 tapT=setTimeout(()=>{taps=0;},1600);};
$('#quit').onclick=()=>{setEdit(false);toast('편집 모드 종료');};
$('#exp').onclick=()=>{const b=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download='약위치_수정본_'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('파일로 저장됨');};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.drugs))throw 0;
  DB=j;save();toast('불러오기 완료');}catch(_){alert('올바른 약위치 파일이 아닙니다');}};
 r.readAsText(f);};
$('#rst').onclick=()=>{if(confirm('모든 수정을 버리고 원본으로 되돌릴까요?')){
 localStorage.removeItem(KEY);load();render();toast('원본 복원됨');}};
$('#theme').onclick=()=>{const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
 document.documentElement.setAttribute('data-theme',n);
 try{localStorage.setItem(KEY+'.t',n);}catch(e){}};
try{const t=localStorage.getItem(KEY+'.t');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
 clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1700);}

load();render();recent();
$('#tot').textContent=DB.drugs.length;$('#upd').textContent=DB.updated;$('#src').textContent=DB.source;
$('#meta').textContent=' '+DB.drugs.length+'개';
if(!matchMedia('(pointer:coarse)').matches)$('#q').focus();
</script></body></html>
